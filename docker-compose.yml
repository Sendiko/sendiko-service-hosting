services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sendiko
      POSTGRES_USER: sendiko
      POSTGRES_PASSWORD: sendiko-local-password
    volumes:
      - sendiko-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sendiko -d sendiko"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: sendiko-service-hosting:latest
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://sendiko:sendiko-local-password@db:5432/sendiko?schema=public
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-this-password}
      AUTH_SECRET: ${AUTH_SECRET:-change-this-session-secret}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    init: true
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - fetch('http://127.0.0.1:3000').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  sendiko-postgres:
